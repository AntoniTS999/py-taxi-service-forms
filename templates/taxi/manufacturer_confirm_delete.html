{% extends "base.html" %}

{% block content %}
  <h1>Delete Manufacturer</h1>
  <p>Are you sure you want to delete manufacturer: {{ manufacturer.name }}?</p>
  <p><i>It couldn't be recovered anf will delete all cars also!</i></p>
  <div class="d-flex">
  <form class="mr-2" action="" method="post">
    {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
  </form>
  <p><a class="btn btn-success" href="{{ request.META.HTTP_REFERER|default:"{% url 'taxi:manufacturer-list' %}"}}">Cancel</a></p>
  </div>
{% endblock %}
